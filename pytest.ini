[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
# loadfile keeps each file's tests on one worker: test_exchange_rates_history
# seeds/deletes shared global rows in a function-scoped fixture, so its tests
# must not interleave across workers.
addopts = -n 4 --dist loadfile
